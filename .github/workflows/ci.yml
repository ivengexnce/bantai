name: BANTAI CI & Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-and-audit:
    name: Security Scans & Dependency Audits
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # Flag warnings in CI

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Dependency Security Audit
        run: npm audit --audit-level=critical
        continue-on-error: true

  build-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        run: npm --workspace=@bantai/shared run build

      - name: Backend Type Check & Build
        run: npm --workspace=@bantai/backend run build

      - name: Run Backend Test Suite
        run: npm test

      - name: Setup Python for Fine-Tuning Pipeline
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Training Pipeline Scripts
        run: |
          python training/scripts/evaluate_model.py --model models/adapters/bantai_v1
          python training/scripts/model_registry.py

name: BANTAI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        run: npm --workspace=@bantai/shared run build

      - name: Run backend unit and integration tests
        run: npm --workspace=@bantai/backend run test

      - name: Setup Python for Fine-Tuning Pipeline
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Training Pipeline Scripts
        run: |
          python training/scripts/evaluate_model.py --model models/adapters/bantai_v1
          python training/scripts/model_registry.py

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: bantai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bantai_users
    volumes:
      - mongo_data:/data/db

  ollama-inference:
    image: ollama/ollama:latest
    container_name: bantai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment if NVIDIA GPU is present:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: bantai-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/bantai_users
      INFERENCE_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama-inference:11434
      JWT_SECRET: bantai-super-secret-production-jwt-key-2026
    depends_on:
      - mongodb
      - ollama-inference
    volumes:
      - backend_data:/app/data

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: bantai-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on:
      - backend

volumes:
  mongo_data:
  ollama_models:
  backend_data:
